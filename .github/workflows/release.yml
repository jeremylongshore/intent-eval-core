name: Release

# Publishes @intentsolutions/core to npm with sigstore provenance.
#
# Triggered by pushing a tag matching `v*.*.*` (e.g., v0.1.0). The job:
#   1. Re-runs the full CI gate chain (lint+typecheck+test+arch+coverage+build)
#   2. Verifies package.json#version matches the pushed tag (defends against
#      tag-vs-package-version drift)
#   3. `pnpm publish` with `--provenance` (requires id-token: write for OIDC)
#
# Provenance attestation lands at https://registry.npmjs.org/@intentsolutions/core
# alongside the published tarball. Consumers can verify with `npm audit signatures`.
#
# Per bead iec-E09 acceptance: "npm publish @intentsolutions/core v0.1.0 succeeds
# (with sigstore signing)".

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  # Required for npm provenance (sigstore OIDC token).
  id-token: write

jobs:
  release:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant: pin the
          # checked-out bytes to the exact ref that triggered this run (the
          # pushed tag), not actions/checkout's implicit default. The bytes we
          # publish + provenance-attest MUST be the tag's bytes, never a moving
          # branch head — provenance is a one-way door.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Tag and package version both: $tag_version"

      - name: Harness verify (hash-pinned policy artifacts)
        run: pnpm run harness:verify

      # Build BEFORE lint/typecheck so the CI emit helpers' kernel self-reference
      # imports resolve to typed dist (see ci.yml for the rationale).
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture rules
        run: pnpm run arch

      - name: Test
        run: pnpm run test

      - name: Coverage (100% floor)
        run: pnpm run test:coverage

      - name: Type tests (tsd)
        run: pnpm run test:types

      - name: Verify dist artifacts emitted
        run: |
          test -f dist/index.js || { echo "missing dist/index.js"; exit 1; }
          test -f dist/index.d.ts || { echo "missing dist/index.d.ts"; exit 1; }
          test -f dist/validators/v1/index.js || { echo "missing dist/validators/v1/index.js"; exit 1; }
          test -f schemas/v1/gate-result.schema.json || { echo "missing gate-result.schema.json"; exit 1; }
          echo "All required dist + schemas artifacts present"

      - name: Publish to npm with provenance
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Publish the Python (Pydantic v2) distribution to PyPI (iec-E08c/E08d) ──
  #
  # Tag-only (v*.*.*). Mirrors the proven audit-harness pattern. GUARDED: the
  # publish + sign steps no-op when PYPI_TOKEN is not configured as a repo
  # secret — the job runs, detects the missing token, and exits 0 with an
  # explanatory log instead of failing the release. Ships wired-but-DORMANT; it
  # activates automatically the moment the secret is set, with no further code
  # change. NEVER publishes on a PR (PRs don't push tags; the `on:` trigger is
  # tag-only).
  #
  # First-publish note: intent-eval-core is a NEW public PyPI package; the very
  # first upload is an immutable claim on the name. The maintainer controls when
  # the first tag is pushed — this job does nothing until then.
  publish-pypi:
    name: Publish Python distribution to PyPI (guarded on PYPI_TOKEN)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create/attach to the GitHub Release (.sigstore bundles)
      id-token: write # sigstore-python keyless signing (Fulcio OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant: the PyPI
          # sdist/wheel is BUILT from this checkout, so the bytes MUST be the
          # pushed tag's bytes. This job is tag-only.
          ref: ${{ github.ref }}

      - name: Verify tag matches Python distribution version (lockstep)
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          # check_version_lockstep.py asserts npm == pyproject == __init__; this
          # additionally pins all three to the pushed tag.
          py_version=$(python3 -c "import re,sys; t=open('python/pyproject.toml').read(); print(re.search(r'(?m)^\s*version\s*=\s*\"([^\"]+)\"', t).group(1))")
          if [ "$tag_version" != "$py_version" ]; then
            echo "::error::Tag v$tag_version does not match python/pyproject.toml version $py_version"
            exit 1
          fi
          python3 scripts/check_version_lockstep.py
          echo "Tag, npm, and Python versions all: $tag_version"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Guard: surface whether the publish token exists. secrets.* cannot be read
      # in a job-level `if`, so we gate the publish + sign steps on this output.
      - name: Check for PyPI token
        id: guard
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_TOKEN secret is not set — skipping PyPI publish. Set it in repo secrets to activate this job automatically."
          fi

      - name: Build sdist + wheel
        if: steps.guard.outputs.token_present == 'true'
        run: |
          python -m pip install --upgrade build twine
          cd python
          python -m build
          twine check dist/*

      # ── Keyless-sign the wheel + sdist with sigstore-python (iec-E08d) ──
      #
      # Per DR-010 Q2 hybrid-language allowance, the Python signing surface uses
      # sigstore-python (the PyPI-ecosystem-native signer), mirroring how the npm
      # leg uses `pnpm publish --provenance` and the emit-evidence job uses
      # cosign. Produces a `<artifact>.sigstore` Sigstore bundle (Fulcio OIDC
      # cert + Rekor inclusion proof) next to each dist artifact, attached to the
      # Release below. Guarded on the same PYPI_TOKEN gate as the publish: a
      # signature only has meaning alongside the bytes that actually ship.
      - name: Sign wheel + sdist (sigstore-python keyless → Rekor)
        if: steps.guard.outputs.token_present == 'true'
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: ./python/dist/*.whl ./python/dist/*.tar.gz
          # We attach the bundles onto the Release ourselves below; don't let the
          # action upload its own duplicate workflow artifacts.
          upload-signing-artifacts: false

      - name: Publish to PyPI
        if: steps.guard.outputs.token_present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python
          # Upload ONLY the built distributions — NOT the .sigstore.json bundles
          # the signing step drops into dist/ (twine rejects those as "Unknown
          # distribution format"). The Sigstore bundles are attached to the
          # GitHub Release in the next step. (This is the audit-harness v1.2.1
          # twine-upload fix applied up front.)
          twine upload --non-interactive dist/*.whl dist/*.tar.gz
          echo "✓ published intent-eval-core to PyPI"

      # Create-or-attach: ensure a Release exists on this tag, then attach the
      # Sigstore bundles so consumers can `python -m sigstore verify identity ...`
      # the downloaded wheel/sdist. The emit-evidence job may also create this
      # Release; both use create-or-upload, so order does not matter.
      - name: Attach .sigstore bundles onto the Release
        if: steps.guard.outputs.token_present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF#refs/tags/}"
          bundles=(python/dist/*.sigstore python/dist/*.sigstore.json)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::sigstore signing produced no bundles to attach"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi
          gh release upload "$tag" "${bundles[@]}" --clobber
          echo "✓ attached ${#bundles[@]} Sigstore bundle(s) to release $tag"

  # ── Emit this repo's own testing evidence for the dashboard (bead nr75.4) ──
  #
  # Runs the deterministic gates → kernel gate-result/v1 rows → kernel
  # EvidenceBundles (scripts/emit-evidence.ts, fail-closed against the kernel
  # schemas), keyless-signs each bundle's CANONICAL bytes with cosign (Fulcio
  # OIDC + Rekor), assembles report-manifest.json (scripts/assemble-manifest.ts),
  # and publishes it as a Release asset. The dashboard's HttpManifestFetcher is
  # pointed at:
  #   https://github.com/jeremylongshore/intent-eval-core/releases/latest/download/report-manifest.json
  # and re-verifies OIDC subject + Rekor inclusion + DSSE + kernel schema at
  # ingest (it never trusts this manifest at render time).
  #
  # The signing identity is this workflow's reusable-workflow ref
  # (release.yml@refs/tags/vX.Y.Z), which matches the dashboard's pinned
  # allowlist entry for `iec` (operatorConfirmed: true).
  emit-evidence:
    name: Emit signed gate-result evidence for the dashboard
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the manifest as a Release asset
      id-token: write # cosign keyless (Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant: this job signs
          # the EvidenceBundle, so the canonical bytes it hashes + cosign-signs
          # MUST come from the pushed tag, not a moving branch head.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (kernel validators must be in dist for the emit self-reference)
        run: pnpm run build

      - name: Emit-evidence self-check (kernel-valid + canonical-stable)
        run: node --experimental-strip-types scripts/emit-evidence.ts --self-check

      - name: Emit gate-result/v1 EvidenceBundles
        run: node --experimental-strip-types scripts/emit-evidence.ts --out build/evidence --ref "${GITHUB_REF}"

      - name: Sign each EvidenceBundle (cosign keyless → Rekor)
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for bundle in build/evidence/bundle-*.json; do
            # skip any already-produced *.sigstore.json
            case "$bundle" in *.sigstore.json) continue;; esac
            sig="${bundle%.json}.sigstore.json"
            echo "::group::cosign sign-blob $bundle"
            # --new-bundle-format emits the sigstore protobuf Bundle
            # (mediaType + verificationMaterial + messageSignature) that the
            # dashboard's sigstore-js verify() consumes. WITHOUT it, cosign
            # writes the legacy {base64Signature, cert, rekorBundle} shape, which
            # sigstore.verify() cannot parse.
            cosign sign-blob --yes --new-bundle-format --bundle "$sig" "$bundle"
            echo "::endgroup::"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::no EvidenceBundles were produced to sign"
            exit 1
          fi
          echo "✓ signed $signed bundle(s)"

      - name: Assemble report-manifest.json (fail-closed on shape mismatch)
        run: node --experimental-strip-types scripts/assemble-manifest.ts --dir build/evidence --out build/evidence/report-manifest.json

      - name: Publish report-manifest.json as a Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # release.yml publishes to npm but does not itself create a GitHub
          # Release object, so create-or-upload (idempotent): create the Release
          # with the asset if absent, else upload/clobber onto the existing one.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/evidence/report-manifest.json --clobber
          else
            gh release create "$tag" build/evidence/report-manifest.json \
              --title "$tag" --generate-notes --verify-tag
          fi
          echo "✓ report-manifest.json published to release $tag"

  # ── Fire a tailnet-only ntfy alert when the tag-release fails (bead 59tx) ──
  #
  # TAG-TRIGGERED ONLY: this workflow runs on `v*.*.*` pushes, so this job
  # never runs on a PR — it fires solely on a future failed tag-release.
  # Joins the tailnet via Tailscale OIDC (tag:ci), waits for the prod VPS to
  # be reachable, then POSTs to the tailnet-only ntfy `prod-deploys` topic.
  alert-on-failure:
    name: alert-on-failure
    needs: [release, publish-pypi, emit-evidence]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to tailnet (Tailscale OIDC)
        uses: tailscale/github-action@v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for tailnet
        run: |
          for _ in $(seq 1 20); do
            if sudo tailscale ping --c 1 --timeout 2s 100.88.144.55; then
              echo "tailnet reachable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::tailnet host 100.88.144.55 unreachable after retries"
          exit 1

      - name: Notify ntfy
        env:
          NTFY_AUTH_TOKEN: ${{ secrets.NTFY_AUTH_TOKEN }}
        run: |
          curl -s -m 10 -X POST "http://intentsolutions:8080/prod-deploys" \
            -H "Title: [intent-eval-core] Release CI FAILED" \
            -H "Priority: high" \
            -H "Tags: prod-deploys,rotating_light" \
            -H "Authorization: Bearer ${NTFY_AUTH_TOKEN}" \
            --data "intent-eval-core release CI FAILED on ref ${{ github.ref_name }} (sha ${{ github.sha }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Phase 3: ping the platform umbrella to regenerate its aggregate changelog ──
  #
  # The umbrella repo intent-solutions-io/intent-eval-platform keeps an aggregate
  # CHANGELOG.md regenerated from every platform repo's GitHub Releases. It already
  # refreshes daily + on workflow_dispatch + on a repository_dispatch of type
  # "release-published". This job POSTs that dispatch right after a release here, so
  # the aggregate updates instantly instead of waiting up to a day.
  #
  # WHY a job INSIDE release.yml (not a standalone `on: release: published`
  # workflow): GitHub suppresses workflow events triggered by Releases that a
  # GITHUB_TOKEN created, so an `on: release` workflow would never fire for our
  # CI-created Release. Running here, after emit-evidence has published the GitHub
  # Release, sidesteps that.
  #
  # needs: emit-evidence — the terminal job that unconditionally create-or-uploads
  # the GitHub Release object (release publishes to npm only; publish-pypi's Release
  # creation is PYPI_TOKEN-gated). Depending on emit-evidence guarantees the Release
  # exists, and transitively that `release` finished (emit-evidence needs release).
  #
  # GUARDED + best-effort: continue-on-error and a token-presence check mean this
  # cleanly no-ops + exits 0 when UMBRELLA_DISPATCH_TOKEN is absent, so this is safe
  # to merge before the secret is provisioned. The umbrella's daily schedule is the
  # backstop either way.
  notify-umbrella-changelog:
    name: Notify umbrella to regenerate the platform changelog
    needs: [emit-evidence]
    runs-on: ubuntu-latest
    continue-on-error: true # best-effort; the umbrella's daily schedule is the backstop
    permissions:
      contents: read
    steps:
      - name: Dispatch release-published to the platform umbrella
        env:
          DISPATCH_TOKEN: ${{ secrets.UMBRELLA_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "UMBRELLA_DISPATCH_TOKEN not configured — skipping umbrella notify (its daily schedule still picks up this release)."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/intent-solutions-io/intent-eval-platform/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF_NAME}\"}}"
          echo "Dispatched release-published to intent-solutions-io/intent-eval-platform."
