name: Prose-anchor validity

# Prose-schema-coherence gate (033-PP-PLAN-skill-refiner-sak-amendment-v7
# § 14.16): every 6767-h master-spec section cited in a kernel schema $comment
# must resolve to a real section heading.
#
# The 6767-h master spec lives in ANOTHER repo (claude-code-plugins), which
# this repo cannot read at CI time — so the gate checks against the VENDORED
# heading inventory at schemas/prose-anchors/6767-h.headings.json (generated by
# scripts/parse-spec-headings.ts; deterministic, markdown-it pinned exact, no
# LLM in the loop per § 14.16.1).
#
# Renumbering a 6767-h section requires regenerating the inventory in the same
# commit as the schema-side citation update (§ 14.16.1 stability discipline).
#
# Exit codes (scripts/check-prose-anchors.ts):
#   0 — every cited anchor resolves
#   1 — at least one dangling anchor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual re-run per § 14.16.3 flake-budget discipline

permissions:
  contents: read

concurrency:
  group: prose-anchors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: prose-anchor validity (6767-h citations)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prose-anchor validity gate
        run: pnpm run check:prose-anchors
