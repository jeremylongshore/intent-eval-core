name: Typos (spell-check)

# Advisory source-spelling lane for the kernel: runs crate-ci/typos over the
# tree on every push + PR. Config lives in .typos.toml (repo root) which holds
# the IEP domain-term ignore-list (iec/iel/iah/iar/iaj, sops, sigstore, rekor,
# zod, …) so platform vocabulary is never flagged as a misspelling.
#
# ADVISORY on rollout (continue-on-error: true), matching the posture of
# lint.yml / doc-quality.yml: typo findings surface in the log without painting
# the check red or blocking the PR while the spelling surface settles. This is
# intentionally NOT a required check — it complements, never gates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run typos
        # Config is auto-discovered from .typos.toml at the repo root.
        # Pinned to a release tag (not @master) so the rule set is reproducible.
        uses: crate-ci/typos@v1.47.2
