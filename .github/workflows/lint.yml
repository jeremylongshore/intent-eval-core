name: Lint (YAML + Actions)

# Deterministic L1 lint for the kernel's CI-config surface: yamllint + actionlint.
# ESLint/Prettier run inside ci.yml (`pnpm run check` + the prettier format gate);
# markdownlint runs in doc-quality.yml (its single home — de-duplicated from here).
# These two jobs are REQUIRED, not advisory: a green required check is signal, a
# red advisory check is noise. yamllint runs --strict so warnings fail the gate.
#
# Configs are vendored so the policy travels with the repo:
#   - YAML:    .audit-harness/configs/.yamllint.yml  (hash-pinned)
#   - Actions: actionlint (built-in rule set)

on:
  # No path filter: these are branch-protection-REQUIRED checks, so they must run
  # (and report) on every PR. A path-filtered required check that is skipped sits
  # "pending" forever and permanently blocks the PR (e.g. a dep-bump touching only
  # package.json). The lanes are fast (<15s), so always-run costs little.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --no-cache-dir "yamllint==1.35.1"

      - name: Run yamllint (--strict — warnings fail the gate)
        run: |
          yamllint --strict \
            --config-file .audit-harness/configs/.yamllint.yml \
            .github/ codecov.yml schemas/

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run actionlint directly (not via the reviewdog wrapper): the binary's own
      # non-zero exit on any error IS the gate, so the check-run settles to a
      # terminal completed/failure status. reviewdog's github-pr-check reporter can
      # leave a zero-findings run stuck at status=in_progress (conclusion=success but
      # never "completed"), which reads as a permanently-pending required check.
      # Pinned to a release tag (script + binary) for reproducibility.
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
