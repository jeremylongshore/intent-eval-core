name: Lint (non-JS)

# Standalone non-JS lint coverage for the kernel: yamllint + actionlint +
# markdownlint. ESLint/Prettier already run inside ci.yml (`pnpm run check`);
# this workflow covers the YAML / GitHub Actions / Markdown surfaces those
# JS-focused gates don't touch.
#
# Configs are vendored so the policy travels with the repo:
#   - YAML:     .audit-harness/configs/.yamllint.yml  (hash-pinned)
#   - Markdown: .markdownlint-cli2.jsonc              (repo root, shared with doc-quality.yml)
#   - Actions:  actionlint (no config — built-in rule set)
#
# All three jobs are advisory (continue-on-error) on first rollout, matching
# doc-quality.yml's posture, so the gate surfaces findings without blocking the
# PR while the YAML/Markdown surface settles.

on:
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - '.audit-harness/configs/.yamllint.yml'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --no-cache-dir "yamllint==1.35.1"

      - name: Run yamllint
        # Advisory lane: warnings surface in the log but do not flip the job
        # to failure. `--strict` (promote warnings to a non-zero exit) is
        # intentionally omitted so pre-existing cosmetic findings (e.g.
        # comment-spacing in coverage-map-gates.yml) don't paint the advisory
        # check red while the YAML surface settles.
        run: |
          yamllint \
            --config-file .audit-harness/configs/.yamllint.yml \
            .github/ codecov.yml schemas/

  actionlint:
    name: actionlint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check
          fail_level: none

  markdownlint:
    name: markdownlint-cli2 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !node_modules
            !dist
            !.audit-harness
