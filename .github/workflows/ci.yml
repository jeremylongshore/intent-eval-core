name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for escape-scan range checks

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Harness verify (hash-pinned policy artifacts)
        run: pnpm run harness:verify

      # Single-source authoring codegen (DR-044 D8): the authoring-family Zod
      # validators + the D7 inline $comment effective-required manifests are
      # GENERATED from schemas/authoring/v1/*. Fail the build if the committed
      # generated output is stale (idempotency gate — re-running must be a no-op).
      - name: Authoring codegen up to date (DR-044 D8 stale-codegen gate)
        run: pnpm run codegen:authoring:check

      # Predicate-namespace isolation (3kye.5 / DR-049): authoring conformance is
      # a deterministic lint, never a signed attestation, so no authoring schema
      # may reference the evals.intentsolutions.io predicate namespace.
      - name: Predicate-namespace isolation (DR-049 authoring/lint vs signed split)
        run: pnpm run check:predicate-namespace

      # Per-chamber isolation (3kye.4 / DR-049 D-SAK-1, CTO ask b+c + CSO binding):
      # the runtime (schemas/v1) and authoring (schemas/authoring) chambers must
      # not share a $schemaVersion lane or a signing trust root. No chamber index
      # carries a shared `schemaVersion`; no authoring index carries a
      # predicate-signing field; no authoring schema anchor resolves to a runtime
      # trust root. Complements the predicate-namespace host gate above.
      - name: Per-chamber isolation (DR-049 D-SAK-1 version-lane + trust-root split)
        run: pnpm run check:chamber-isolation

      # Rubric-floor self-pin (3kye.6 / DR-049): the anti-realignment guard — a
      # required field may not be removed/weakened from any contract's overlay
      # required set or the securityChecks fold without an explicit ADR marker.
      - name: Rubric-floor guard (DR-049 anti-realignment self-pin)
        run: pnpm run check:rubric-floor

      # Build BEFORE lint/typecheck: the CI emit helpers (scripts/emit-evidence.ts,
      # scripts/assemble-manifest.ts) import the kernel validators via the package
      # self-reference (@intentsolutions/core/...), which only resolves to typed
      # dist after a build. Without this, type-aware lint reports no-unsafe-call on
      # the schema .parse() calls and typecheck cannot find the module.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Format check (prettier — L1 deterministic gate, required)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture rules (Blueprint A anti-goals)
        run: pnpm run arch

      - name: Test (runtime + in-process type assertions)
        run: pnpm run test

      - name: Coverage (100% floor enforced via vitest config)
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Type tests (tsd — second-opinion against published surface)
        run: pnpm run test:types

      - name: API surface check (iec-E07 SemVer regression gate)
        id: api_check
        run: pnpm run api:check
        continue-on-error: true

      - name: API diff report (if surface drifted)
        if: steps.api_check.outcome == 'failure'
        run: |
          pnpm run api:diff || true
          echo "::error::Public API surface has drifted from the committed golden snapshot."
          echo "::error::If this is intentional, bump version per per-repo blueprint § 11.1, run \`pnpm run api:extract\` to update api/intentsolutions-core.api.md, and commit the snapshot in the same PR."
          exit 1

      - name: Verify dist artifacts emitted
        run: |
          test -f dist/index.js || { echo "missing dist/index.js"; exit 1; }
          test -f dist/index.d.ts || { echo "missing dist/index.d.ts"; exit 1; }
          echo "dist/ artifacts present"
