name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for escape-scan range checks

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Harness verify (hash-pinned policy artifacts)
        run: pnpm run harness:verify

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture rules (Blueprint A anti-goals)
        run: pnpm run arch

      - name: Test (runtime + in-process type assertions)
        run: pnpm run test

      - name: Coverage (100% floor enforced via vitest config)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Type tests (tsd — second-opinion against published surface)
        run: pnpm run test:types

      - name: Verify dist artifacts emitted
        run: |
          test -f dist/index.js || { echo "missing dist/index.js"; exit 1; }
          test -f dist/index.d.ts || { echo "missing dist/index.d.ts"; exit 1; }
          echo "dist/ artifacts present"
